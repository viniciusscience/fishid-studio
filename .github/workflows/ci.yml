name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  syntax-and-tests:
    name: Python Syntax, Smoke Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt

      - name: Check Python syntax across all scripts and services
        run: |
          python -m py_compile \
            backend/main.py \
            backend/storage.py \
            frontend/app.py \
            monitoramento_em.py \
            rodar_suite_benchmark.py \
            rastrear_peixes_auto.py \
            segmentar_peixes_auto.py

      - name: Verify required project files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f .env.example
          test -f docker-compose.yml
          test -f backend/Dockerfile
          test -f frontend/Dockerfile

      - name: Install runtime & test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            ruff \
            httpx \
            "fastapi>=0.115.0" \
            "python-multipart>=0.0.12" \
            "filelock>=3.16.0" \
            "opencv-python-headless>=4.10.0" \
            "pillow>=10.4.0" \
            "numpy>=1.26.0" \
            pandas \
            tqdm

      - name: Smoke-test backend API and core modules
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'backend')
          import main, storage
          from fastapi.testclient import TestClient
          client = TestClient(main.app)
          assert client.get('/health').status_code == 200
          info = client.get('/info')
          assert info.status_code == 200
          assert len(info.json()['species_catalog']) == 10
          import segmentar_peixes_auto
          print('Backend & core module smoke check passed!')
          "

      - name: Lint API, monitoring and tests
        run: ruff check --isolated --select E4,E7,E9,F backend monitoramento_em.py tests

      - name: Run pytest suite
        run: python -m pytest -v
